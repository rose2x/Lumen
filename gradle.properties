# gradle.properties
# Global settings for the Gradle build itself.

# Give Gradle more memory so builds (especially with native/NDK code) don't fail.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (the modern standard) instead of the old support library.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Speeds up multi-module builds by running independent tasks in parallel.
org.gradle.parallel=true
