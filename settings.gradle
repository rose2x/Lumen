// settings.gradle
// This file tells Gradle (Android's build tool) which modules make up this project.
// We only have one module: "app" (the actual Android application).

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Vironix"
include(":app")
